<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CleanFrame Clock</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  .photo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 2s ease}
  .photo.on{opacity:.55}
  .veil{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.15),rgba(0,0,0,.6))}
  .clock{position:fixed;left:50%;top:50%;text-align:center;color:rgba(255,255,255,.9);font-family:Manrope,Arial,sans-serif;
    transform:translate(-50%,-50%);transition:transform 2s ease;text-shadow:0 2px 12px rgba(0,0,0,.35)}
  .time{font-size:20vh;line-height:1;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .date{margin-top:2.5vh;font-size:3.6vh;font-weight:500;opacity:.7}
</style>
</head>
<body>
<img class="photo" id="photo" alt="">
<div class="veil"></div>
<div class="clock" id="clock"><div class="time" id="time"></div><div class="date" id="date"></div></div>
<script>
(function () {
  'use strict';
  var N = window.CleanFrameNative, look = {}, photo = document.getElementById('photo');
  try { look = JSON.parse(localStorage.getItem('cleanframe.home.v1')) || {}; } catch (e) { look = {}; }
  var wall = String(look.wall || look.wallpaper || 'misty');
  if (/^[a-z0-9-]+$/.test(wall) && look.bg !== 'dark' && look.bg !== 'light') {
    photo.onload = function () { photo.className = 'photo on'; };
    photo.src = 'assets/wallpapers/' + wall + '.jpg';
  }
  function h24() { try { return N && N.getPref('clock') === '24'; } catch (e) { return false; } }
  function two(n) { return (n < 10 ? '0' : '') + n; }
  function tick() {
    var d = new Date(), h = d.getHours(), date;
    document.getElementById('time').textContent = h24() ? two(h) + ':' + two(d.getMinutes()) : (h % 12 || 12) + ':' + two(d.getMinutes());
    try { date = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }); } catch (e) { date = d.toDateString(); }
    document.getElementById('date').textContent = date;
    /* Drift so no pixel holds the same image for long. */
    var x = Math.round(Math.random() * 40) - 20, y = Math.round(Math.random() * 30) - 15;
    document.getElementById('clock').style.transform = 'translate(calc(-50% + ' + x + 'vw), calc(-50% + ' + y + 'vh))';
    setTimeout(tick, 60000 - (Date.now() % 60000) + 30);
  }
  tick();
}());
</script>
</body>
</html>
