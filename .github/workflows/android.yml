name: Google TV APK

on:
  push:
    paths: ['app/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # Optional: keep one signing key so new builds install over old ones.
      # Add repo secrets CF_KEYSTORE_B64, CF_KEYSTORE_PASSWORD, CF_KEY_ALIAS, CF_KEY_PASSWORD.
      - name: Restore signing key
        env:
          CF_KEYSTORE_B64: ${{ secrets.CF_KEYSTORE_B64 }}
        if: env.CF_KEYSTORE_B64 != ''
        run: |
          echo "$CF_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cleanframe.jks"
          echo "CF_KEYSTORE=$RUNNER_TEMP/cleanframe.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          CF_KEYSTORE_PASSWORD: ${{ secrets.CF_KEYSTORE_PASSWORD }}
          CF_KEY_ALIAS: ${{ secrets.CF_KEY_ALIAS }}
          CF_KEY_PASSWORD: ${{ secrets.CF_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/CleanFrame-GoogleTV.apk"
          sha256sum "$GITHUB_WORKSPACE/CleanFrame-GoogleTV.apk" | tee "$GITHUB_WORKSPACE/CleanFrame-GoogleTV.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: CleanFrame-GoogleTV
          path: |
            CleanFrame-GoogleTV.apk
            CleanFrame-GoogleTV.apk.sha256
