name: Roku package

on:
  push:
    paths: ['roku/**', '.github/workflows/roku.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package
        working-directory: roku
        run: |
          zip -r "$GITHUB_WORKSPACE/CleanFrame-Roku.zip" manifest source components images/walls images/splash_fhd.jpg images/icon_focus_fhd.jpg images/icon_focus_hd.jpg images/plate-solid.9.png fonts -x '*.DS_Store'
          ls -l "$GITHUB_WORKSPACE/CleanFrame-Roku.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: CleanFrame-Roku
          path: CleanFrame-Roku.zip
